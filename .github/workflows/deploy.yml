# Build the VisCon1 images on every push to main (the poller on your LAN pulls
# ghcr.io/insecurityfyi/linkwatch-poller). The VPS normally updates itself by
# running deploy/update.sh by hand. The SSH deploy job below only runs when you
# start this workflow yourself (Actions > deploy > Run workflow), and needs:
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   VPS_SSH_KEY          private key of the dedicated deploy key (see docs/install-centos9.md, step 8)
#   VPS_SSH_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 129.121.123.176
# Repository variables (same page, Variables tab), optional:
#   VPS_HOST             defaults to 129.121.123.176
#   VPS_USER             defaults to aperrego
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/linkwatch
  POLLER_IMAGE: ghcr.io/${{ github.repository_owner }}/linkwatch-poller

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r linkwatch/requirements-dev.txt
      - run: python -m pytest -q tests/linkwatch

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.linkwatch
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build and push poller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.poller
          platforms: linux/amd64,linux/arm64
          build-args: LW_BUILD=${{ steps.tag.outputs.tag }}
          push: true
          tags: |
            ${{ env.POLLER_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.POLLER_IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=poller
          cache-to: type=gha,mode=max,scope=poller

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ vars.VPS_HOST || '129.121.123.176' }}
      USER: ${{ vars.VPS_USER || 'aperrego' }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" || { echo "::error::Add the VPS_SSH_KEY secret"; exit 1; }
          test -n "$KNOWN" || { echo "::error::Add the VPS_SSH_KNOWN_HOSTS secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Copy unit files and deploy script
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes"
          $SSH "$USER@$HOST" 'mkdir -p ~/linkwatch/quadlet'
          scp -i ~/.ssh/deploy_key -o BatchMode=yes deploy/quadlet/* "$USER@$HOST:linkwatch/quadlet/"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes deploy/deploy.sh "$USER@$HOST:linkwatch/deploy.sh"
      - name: Pull the new image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" \
            "podman login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null && bash ~/linkwatch/deploy.sh '$TAG'"
