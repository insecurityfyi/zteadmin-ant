82 419.88,339.77 419.38,340.09 C 418.33,340.75 355.62,340.60 355.21,339.93 Z"/>
      <path d="M 288.13,225.49 L 294.45,208.10 A 46.50,46.50 0 0 1 290.59,296.72 L 285.80,278.85 A 28.00,28.00 0 0 0 288.13,225.49 Z"/>
