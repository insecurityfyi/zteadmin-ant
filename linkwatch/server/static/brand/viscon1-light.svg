      <circle cx="278.55" cy="251.8" r="14.5"/>
    </clipPath>
    <clipPath id="faceClip-vc1">
      <rect x="43.5" y="43.5" width="425.0" height="425.0" rx="95" ry="95"/>
    </clipPath>
    <linearGradient id="vGrad" x1="90" y1="164" x2="268" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B4CFB"/>
      <stop offset="55%" stop-color="#2B6AF6"/>
      <stop offset="100%" stop-color="#2A8AF0"/>
    </linearGradient>
    <linearGradient id="oneGrad" x1="300" y1="200" x2="420" y2="340" gradientUnits="userSpaceOnUse">
