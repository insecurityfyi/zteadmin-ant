<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 28 456 456" width="512" height="512" role="img" aria-label="VC1">
  <title>VC1 — Visibility and Control 1</title>
  <desc>Minimal light VC1 mark — a geometric V, segmented C control dial with a teal center, and a numeral 1 ligatured with the right C arc.</desc>
  <defs>
    <style type="text/css"><![CDATA[

    .dot-glow {
      transform-box: fill-box; transform-origin: center;
      animation: glow 2s ease-in-out infinite;
    }
    .dot {
      transform-box: fill-box; transform-origin: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .ring-a { animation: ringA 4s linear infinite; }
    .ring-b { animation: ringB 4s linear infinite; }
    .crescent {
      transform-origin: 0 0;
      animation: sweep 4s ease-in-out infinite;
    }
    .sheen {
      transform-box: view-box; transform-origin: 0px 0px;
      animation: sheen 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.10); }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.30; transform: scale(1); }
      50%      { opacity: 0.65; transform: scale(1.28); }
    }
    @keyframes ringA {
      0%        { r: 16; opacity: 0.55; stroke-width: 2.0; }
      45%       { r: 34; opacity: 0;    stroke-width: 0.6; }
      50%, 100% { r: 16; opacity: 0;    stroke-width: 2.0; }
    }
    @keyframes ringB {
      0%, 50%   { r: 16; opacity: 0;    stroke-width: 2.0; }
      50.01%    { r: 16; opacity: 0.55; stroke-width: 2.0; }
      95%       { r: 34; opacity: 0;    stroke-width: 0.6; }
      100%      { r: 16; opacity: 0;    stroke-width: 2.0; }
    }
    @keyframes sweep {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-18deg); }
    }
    @keyframes sheen {
      0%   { transform: translate(-280px, 0); }
      100% { transform: translate(560px, 0); }
    }

    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    ]]></style>
    <clipPath id="markClip-vc1">
