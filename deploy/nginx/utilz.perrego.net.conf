# /etc/nginx/conf.d/utilz.perrego.net.conf
# Certbot adds the "listen 443 ssl" lines and certificate paths to this file the first time it runs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name utilz.perrego.net;

    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Browsers ignore HSTS over plain HTTP, so this only takes effect once certbot has added "listen 443 ssl".
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Enforced: parts of a CSP that can't break a page. The full policy is report-only for now: watch the browser
    # console for "[Report Only]" violations, then move it to Content-Security-Policy.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # X-Forwarded-For is set to the client's address, not appended to: uvicorn runs with --forwarded-allow-ips '*'
    # and takes the first entry, so an appended header would let a client pick the address the app sees.

    # Pollers hold one WebSocket open for as long as they run. This prefix also covers SSH consoles:
    # /api/poller/ws/tunnel/<id> (a poller's reverse tunnel), /api/poller/ws/console (SSH terminal) and /api/poller/ws/rdp.
    location /api/poller/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Zscaler Cloud NSS feeds push batches of logs here (docs/zscaler-cloud-nss.md).
    location /api/nss/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64m;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
